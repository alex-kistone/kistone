# Mises à jour de sécurité automatiques : chaque lundi, une pull request par dépendance
# vulnérable ou en retard (site React et scripts). Les alertes de sécurité GitHub doivent être
# activées dans les réglages du dépôt (Security → Dependabot alerts).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]
    commit-message:
      prefix: "Dépendances"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
